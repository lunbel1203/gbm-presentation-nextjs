# ==========================================================================
# GBM CMS — Strapi + Postgres
# Desplegar en el VPS en: /opt/docker/services/strapi
#
#   1) cp .env.example .env  (y rellenar secretos)
#   2) docker compose up -d --build
#
# Strapi queda accesible:
#   - Público (panel admin):  https://${CMS_DOMAIN}  (admin.glaringmaintenance.com, vía Traefik)
#   - Interno (validación):   http://gbm-strapi:1337  (red traefik-public)
# Una sola instancia administra ambas presentaciones (RD y USA).
# ==========================================================================

services:
  strapi-db:
    image: postgres:16-alpine
    container_name: gbm-strapi-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-strapi}
      POSTGRES_USER: ${DATABASE_USERNAME:-strapi}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Define DATABASE_PASSWORD en .env}
    volumes:
      - strapi-db-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-strapi} -d ${DATABASE_NAME:-strapi}"]
      interval: 10s
      timeout: 5s
      retries: 10

  strapi:
    build: .
    container_name: gbm-strapi
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_CLIENT: postgres
      DATABASE_HOST: strapi-db
      DATABASE_PORT: 5432
    depends_on:
      strapi-db:
        condition: service_healthy
    volumes:
      - strapi-uploads:/app/public/uploads
    networks:
      - internal
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.gbm-strapi.rule=Host(`${CMS_DOMAIN}`)"
      - "traefik.http.routers.gbm-strapi.entrypoints=websecure"
      - "traefik.http.routers.gbm-strapi.tls=true"
      - "traefik.http.services.gbm-strapi.loadbalancer.server.port=1337"

networks:
  # Red pública compartida con Traefik y las presentaciones Next.js
  traefik-public:
    external: true
  # Red privada Strapi <-> Postgres (la BD nunca se expone)
  internal:
    driver: bridge

volumes:
  strapi-db-data:
  strapi-uploads:
