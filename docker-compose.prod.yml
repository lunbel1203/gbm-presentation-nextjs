version: '3.8'

services:
  gbm-app-usa:
    build: .
    container_name: gbm-presentation-usa
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      # Integración con Strapi (validación de tokens + logging de accesos)
      - STRAPI_URL=http://gbm-strapi:1337
      - PRESENTATION_LANG=usa
      # VALIDATION_SECRET se define en .env.production (secreto, debe coincidir con Strapi)
    env_file:
      - .env.production
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gbm-presentation-usa.rule=Host(`presentationusa.glaringmaintenance.com`)"
      - "traefik.http.routers.gbm-presentation-usa.entrypoints=websecure"
      - "traefik.http.routers.gbm-presentation-usa.tls=true"
      - "traefik.http.services.gbm-presentation-usa.loadbalancer.server.port=3000"
      - "traefik.docker.network=traefik-public"

networks:
  traefik-public:
    external: true
