services:
  gbm-app-rd:
    build: .
    container_name: gbm-presentation-rd
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    env_file:
      - .env.production
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gbm-presentation-rd.rule=Host(`presentacionrd.glaringmaintenance.do`)"
      - "traefik.http.routers.gbm-presentation-rd.entrypoints=websecure"
      - "traefik.http.routers.gbm-presentation-rd.tls=true"
      - "traefik.http.services.gbm-presentation-rd.loadbalancer.server.port=3000"
      - "traefik.docker.network=traefik-public"

networks:
  traefik-public:
    external: true
